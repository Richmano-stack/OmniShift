version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: omnishift-postgres
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omnishift
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
